name: news-browse
device: first

steps:
  - kind: act
    tool: launch-app
    args:
      bundleId: com.apple.news

  - kind: act
    tool: gesture-tap
    args:
      x: 0.154
      y: 0.941

  - kind: act
    tool: await-screen-idle

  - kind: act
    tool: gesture-tap
    args:
      x: 0.154
      y: 0.941

  - kind: act
    tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Stories
      timeoutMs: 20000

  - kind: act
    tool: await-screen-idle

  - kind: assert
    name: feed-shown
    question: Is the Apple News Today feed shown, with a section heading and at least one article card?

  - kind: choose
    name: top-article
    question: Which element is the first news article card at the top of the feed, below the section heading?
    roles: [Group]
    then: tap

  - kind: act
    tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: BackButton
      timeoutMs: 15000

  - kind: act
    tool: await-screen-idle

  - kind: assert
    name: article-open
    question: Is a single news article reading view open, showing article text or its headline, rather than the feed of cards?

  - kind: act
    tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.85
      toX: 0.5
      toY: 0.15

  - kind: act
    tool: await-screen-idle

  - kind: assert
    name: article-scrolled
    question: Has the article content been scrolled down from the top, so the vertical scroll bar position is no longer 0%?
    threshold: 0.7

  - kind: act
    tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.4
      toX: 0.5
      toY: 0.6

  - kind: act
    tool: await-screen-idle

  - kind: choose
    name: back-to-feed
    question: Which element is the back button in the navigation bar that returns from the article to the Today feed?
    then: tap

  - kind: act
    tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Sports
      timeoutMs: 15000

  - kind: act
    tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.8
      toX: 0.5
      toY: 0.3

  - kind: act
    tool: await-screen-idle

  - kind: assert
    name: feed-scrolled
    question: Is the Today feed shown and scrolled down from the top, so the vertical scroll bar position is no longer 0%?
    threshold: 0.7

  - kind: choose
    name: second-article
    question: Which element is a news article card that is not the first card and is not marked Apple News Plus?
    roles: [Group]
    threshold: 0.5
    then: tap

  - kind: act
    tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: BackButton
      timeoutMs: 15000

  - kind: act
    tool: await-screen-idle

  - kind: assert
    name: second-article-open
    question: Is a single news article reading view open, showing article text or its headline, rather than the feed of cards?
